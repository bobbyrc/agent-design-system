name: Teaching web machine checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  machine-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Legacy measurement tests
        run: python3 -m unittest discover -s skills/figma-ui/scripts -p 'test_*.py'
      - name: Evidence validation negative tests
        run: npm test
      - name: Focus CSS browser negative regression
        run: npm run test:browser
      - name: Chromium machine checks (visual gate remains BLOCKED)
        run: npm run verify:machine
      - name: Upload actual execution artifacts, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: equipment-ui-evidence
          path: artifacts/ui-runs/
          if-no-files-found: error
          retention-days: 7
